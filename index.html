<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boligvælger • Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Lysholm Have – Boligvælger (demo)</h1>
    <div class="legend">
      <span class="dot ledig"></span> Ledig
      <span class="dot reserveret"></span> Reserveret
      <span class="dot udlejet"></span> Udlejet
    </div>
  </header>
  <div id="map"></div>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close" id="closeModal" aria-label="Luk">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
